[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eng-drawing-viewer"
dynamic = ["version"]
license = {file = "LICENSE"}
authors = [{name = "ca-works"}]
description = "Fast, offline viewer, markup and PowerPoint export tool for engineering PDF drawings."
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8,<6.13",
    # PyMuPDF 2.x hard-depends on onnxruntime/numpy/LLM tooling (~120 MB) that the
    # viewer never uses; the 1.2x line renders identically with no dependencies.
    "PyMuPDF>=1.26,<2",
    "python-pptx>=1.0",
    "python-docx>=1.1",  # PDF → Word in PDF Tools
    "XlsxWriter>=3.1",  # PDF → Excel in PDF Tools
    "pillow>=10",  # WebP images
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",  # HEIC photos from the iPhone
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",  # on-device OCR
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.11"]

[project.gui-scripts]
eng-drawing-viewer = "eng_viewer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eng_viewer = ["resources/*", "resources/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["slow: rendering/export tests that take a few seconds"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.setuptools.dynamic]
version = {attr = "eng_viewer.__version__"}
