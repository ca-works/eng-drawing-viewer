# Builds the macOS Universal edition (one app, arm64 + x86_64 in every binary) from this repository's
# published source, on GitHub-hosted runners (free for public repositories), then smoke-tests it on a
# real Intel Mac runner. Runs only by hand; nothing is released or published by this workflow.
name: universal

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build"
        default: v2.3.1
        required: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  universal:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3
        with:
          version: "0.12.24"
          enable-cache: false
      - name: System and Rosetta 2
        run: |
          sw_vers; uname -m
          arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/uname -m
      - name: Universal interpreter and wheelhouse
        run: |
          uv python install 3.13.16
          echo "PYTHON=$(uv python find 3.13.16)" >> "$GITHUB_ENV"
          PYTHON="$(uv python find 3.13.16)" packaging/macos/prepare_universal.sh "$RUNNER_TEMP/universal"
      - name: Minimal OpenCV for arm64 and x86_64, fused
        run: packaging/macos/build_universal_opencv.sh "$RUNNER_TEMP/universal"
      - name: Build, test (both architectures) and smoke-test (both architectures)
        env:
          EDITION: universal
          RUN_TESTS: "1"
        run: |
          export UNIVERSAL_PYTHON="$RUNNER_TEMP/universal/python"
          export UNIVERSAL_WHEELHOUSE="$RUNNER_TEMP/universal/wheelhouse"
          packaging/macos/build_macos.sh
          cp "$RUNNER_TEMP"/universal/*report*.json "$RUNNER_TEMP"/universal/wheelhouse/*report*.json build/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: edition-macos-universal
          retention-days: 7
          if-no-files-found: warn
          path: |
            release/macos/*.dmg
            release/macos/*.zip
            release/macos/build-report-*.json
            build/check_bundle-*.json
            build/smoke-*.log
            build/*report*.json

  universal-on-intel:
    needs: universal
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: edition-macos-universal
          path: candidate
      - name: Smoke test on Intel hardware with network monitoring
        run: |
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string
          ZIP="$(find candidate -name '*-macOS-Universal.zip' | head -1)"
          mkdir app && ditto -x -k "$ZIP" app
          APP="app/ENG Drawing Viewer.app"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/ENG Drawing Viewer"
          python3 - <<'PY'
          content = b"BT /F1 24 Tf 72 720 Td (Smoke test) Tj ET"
          objs = [b"<< /Type /Catalog /Pages 2 0 R >>", b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
                  b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>",
                  b"<< /Length %d >>\nstream\n" % len(content) + content + b"\nendstream",
                  b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"]
          out, offs = bytearray(b"%PDF-1.4\n"), []
          for i, o in enumerate(objs, 1):
              offs.append(len(out)); out += b"%d 0 obj\n" % i + o + b"\nendobj\n"
          x = len(out)
          out += b"xref\n0 %d\n0000000000 65535 f \n" % (len(objs) + 1) + b"".join(b"%010d 00000 n \n" % o for o in offs)
          out += b"trailer << /Size %d /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n" % (len(objs) + 1, x)
          open("smoke.pdf", "wb").write(out)
          PY
          ENG_VIEWER_SMOKE_TEST=1 ENG_VIEWER_SMOKE_LOG="$PWD/smoke.log" "$APP/Contents/MacOS/ENG Drawing Viewer" "$PWD/smoke.pdf" &
          PID=$!
          : > net.log
          while kill -0 $PID 2>/dev/null; do
            for p in $PID $(pgrep -P $PID); do lsof -nP -a -p $p -i 2>/dev/null | tail -n +2 >> net.log; done
            sleep 0.2
          done
          wait $PID; STATUS=$?
          cat smoke.log; echo "exit status $STATUS"
          echo "--- network sockets seen:"; sort -u net.log
          test $STATUS -eq 0
          grep -q "3 PDF tool jobs OK" smoke.log
          grep -q '"original_unchanged": true' smoke.log
          test ! -s net.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: universal-on-intel-logs
          retention-days: 7
          path: |
            smoke.log
            net.log
